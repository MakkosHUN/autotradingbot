name: Multi-Frequency Quant Engine v3.5

on:
  schedule:
    # 1. FULL 3-ENGINE SCAN: NYSE Open (14:35 UTC) & NYSE Close (20:35 UTC), Mon-Fri
    - cron: '35 14,20 * * 1-5'

    # 2. SHORT-TERM MOMENTUM + CRYPTO: Every hour in between during NYSE hours, Mon-Fri
    - cron: '35 15,16,17,18,19 * * 1-5'

    # 3. 24/7 CRYPTO AI QUANT: Every 2 hours overnight & all weekend (Sat-Sun)
    - cron: '15 0,2,4,6,8,10,12,22 * * 1-5'
    - cron: '15 */2 * * 0,6'

  workflow_dispatch:
    inputs:
      bot_mode:
        description: 'Select Engine to Run (all, core, momentum, crypto)'
        required: false
        default: 'all'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache HuggingFace FinBERT Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-finbert-cache-v2

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch transformers
          pip install "alpaca-trade-api==3.2.0" "yfinance==0.2.58" gspread google-auth pandas numpy requests

      - name: Route & Execute Quant Engine by Schedule
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ github.event.inputs.bot_mode }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${MANUAL_MODE:-all}"
            echo "🚀 Manual Trigger Detected -> Running Mode: $MODE"
            python bot.py --mode "$MODE"
          elif [ "$SCHEDULE_CRON" = "35 14,20 * * 1-5" ]; then
            echo "🏛️ NYSE Open/Close Window -> Running ALL 3 Engines (Core + Momentum + Crypto)"
            python bot.py --mode all
          elif [ "$SCHEDULE_CRON" = "35 15,16,17,18,19 * * 1-5" ]; then
            echo "⚡ NYSE Intraday Hourly Window -> Running Short-Term Momentum + 24/7 Crypto"
            python bot.py --mode momentum
            python bot.py --mode crypto
          else
            echo "🪙 Off-Hours / Weekend Window -> Running 24/7 Crypto AI Engine Only"
            python bot.py --mode crypto
          fi
