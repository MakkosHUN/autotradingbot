name: AETHER QUANT v8.5 Multi-Frequency 7-Engine Router

on:
  workflow_dispatch:
    inputs:
      bot_mode:
        description: 'Execution Mode (smart_cron, auto, intraday, crypto, all, core, momentum, discovery, mean_rev, small_cap, tail_hedge)'
        required: false
        default: 'smart_cron'

concurrency:
  group: aether-quant-execution
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache HuggingFace FinBERT Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-finbert-cache-v2

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch transformers
          pip install "alpaca-trade-api==3.2.0" "yfinance==0.2.58" gspread google-auth pandas numpy requests

      - name: Route & Execute AETHER QUANT v8.5.3 Engine
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          MANUAL_MODE: ${{ github.event.inputs.bot_mode }}
        run: |
          MODE="${MANUAL_MODE:-smart_cron}"
          echo "🚀 Dispatching AETHER QUANT -> Mode: $MODE"
          python bot.py --mode "$MODE"
