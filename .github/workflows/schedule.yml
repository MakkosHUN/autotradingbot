name: Trading Bot Scheduler

on:
  schedule:
    # This translates to 14:00 UTC (10:00 AM Eastern) Monday through Friday
    - cron: '0 14 * * 1-5' 
  workflow_dispatch: # This adds a manual "Play" button in GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Grab my code
        uses: actions/checkout@v4
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Alpaca and TextBlob
        run: |
          pip install alpaca-trade-api textblob
          python -m textblob.download_corpora
          
   - name: Execute the Bot
            env:
              APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
              APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
            run: python bot.py
